<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8fa" />
    <meta name="description" content="ASTRA astronaut health monitoring prototype. Sourced decision support with clearly labelled simulated data." />
    <title>ASTRA · Crew health</title>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('astra.theme'); } catch {}
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved === 'dark' || (saved !== 'light' && systemDark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
